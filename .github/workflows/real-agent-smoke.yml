name: Real-Agent Smoke

# Invokes Claude Code and Codex non-interactively against the repo's shipped
# CLAUDE.md / AGENTS.md. Two probes per agent: a config probe that asks
# which skill `/vet` aliases, answerable only from the loaded rules file
# (Claude runs it with every tool disabled; Codex is told not to use one),
# and a roster probe that asks for the directories under skills/ holding a
# SKILL.md and expects every shipped skill. The rules file carries no
# roster since the 2026-09 rewrite, so the tree is the source and the
# probe shows the agent can reach it. GitHub Actions runners do not ship
# the agents; this workflow installs them, uses API key secrets, and
# spends under $0.10 per run (four short API calls).
#
# Triggers are intentionally narrow to keep API cost low. This is a setup
# and behavior verification — it does not need to run on every push:
#
#   - release.published  — validates each release after it is tagged
#   - workflow_dispatch  — manual run against any branch from the Actions UI
#
# Mechanical drift is caught by validate.yml on every push; this workflow
# is only for the agents-actually-see-the-config check.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY — https://console.anthropic.com/settings/keys
#   OPENAI_API_KEY    — https://platform.openai.com/api-keys
#
# The expected skill list is auto-detected from skills/*/SKILL.md so this
# workflow is shared by the public and the source repo without per-repo
# edits. The config probe's answer is a line of the shared rules file
# ("`vet` is the alias for `implement-review`"); a fork that drops that
# line skips the probe instead of failing it.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  claude-smoke:
    name: Claude Code sees CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude loads CLAUDE.md and sees the shipped skill roster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          EXPECTED_SKILLS=()
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] || continue
            EXPECTED_SKILLS+=("$(basename "$d")")
          done
          if [ "${#EXPECTED_SKILLS[@]}" -eq 0 ]; then
            echo "::error::no shipped skills found under skills/"
            exit 1
          fi
          # The model and effort come from the registry (user/agent-models.json)
          # through its resolver, never from a literal here. The probes verify
          # config loading and skill enumeration, not prose quality, so they run
          # on the registry's worker row, the cheap tier, and not on the
          # interactive default.
          if ! SMOKE_MODEL=$(python3 scripts/agent_models.py resolve --family claude --role worker --field model) ||
             ! SMOKE_EFFORT=$(python3 scripts/agent_models.py resolve --family claude --role worker --field effort); then
            echo "::error::cannot resolve the Claude worker model from user/agent-models.json (scripts/agent_models.py resolve failed)"
            exit 1
          fi
          # CLAUDE_CODE_EFFORT_LEVEL outranks --effort, so the child gets the effort through it.
          export CLAUDE_CODE_EFFORT_LEVEL="$SMOKE_EFFORT"
          echo "requested: $SMOKE_MODEL $SMOKE_EFFORT"
          # Run one probe and leave its answer in RESP. Passing the model flag
          # proves only what was asked for, so the transcript Claude Code wrote
          # for this --session-id is read back for the model and effort that
          # actually ran, and a mismatch fails the job. Extra arguments go last
          # because --tools is variadic and would swallow anything after it.
          claude_probe() {
            local prompt="$1" sid actual
            shift
            sid=$(python3 -c 'import uuid; print(uuid.uuid4())')
            RESP=$(claude -p "$prompt" --model "$SMOKE_MODEL" --session-id "$sid" "$@")
            actual=$(python3 scripts/agent_models.py actual --family claude --session-id "$sid" \
              --expect-model "$SMOKE_MODEL" --expect-effort "$SMOKE_EFFORT")
            echo "requested: $SMOKE_MODEL $SMOKE_EFFORT; $actual"
            case "$actual" in
              *"status=mismatch"*)
                echo "::error::Claude ran on a different model or effort than the registry asked for: $actual"
                exit 1 ;;
              *"status=unknown"*)
                echo "::warning::could not read back the model Claude ran on; the request is unverified" ;;
            esac
          }
          if grep -q 'is the alias for `implement-review`' AGENTS.md; then
            CONFIG_PROMPT='According to CLAUDE.md, /vet is an alias of which skill? Reply with the directory name of that skill only.'
            # --tools "" leaves the model nothing but its loaded instructions.
            claude_probe "$CONFIG_PROMPT" --tools ""
            echo "::group::claude config probe response"
            echo "$RESP"
            echo "::endgroup::"
            if ! grep -q "implement-review" <<<"$RESP"; then
              echo "::error::Claude did not answer implement-review from CLAUDE.md (is the file loaded?)"
              exit 1
            fi
            echo "PASS: Claude answered the config probe from CLAUDE.md"
          else
            echo "SKIP: AGENTS.md does not state the vet alias; config probe skipped"
          fi
          ROSTER_PROMPT='List the skills shipped in this repository, meaning the directories under skills/ that contain a SKILL.md. Reply with the directory names only, comma-separated, no other text.'
          claude_probe "$ROSTER_PROMPT"
          echo "::group::claude roster response"
          echo "$RESP"
          echo "::endgroup::"
          MISSING=()
          for skill in "${EXPECTED_SKILLS[@]}"; do
            if ! grep -q "$skill" <<<"$RESP"; then
              MISSING+=("$skill")
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::missing from response: ${MISSING[*]}"
            exit 1
          fi
          echo "PASS: all ${#EXPECTED_SKILLS[@]} shipped skills mentioned"

  # The two Codex probes are separate jobs: codex-action's drop-sudo
  # strategy removes passwordless sudo when it starts and cannot start a
  # second time in the same job.
  codex-config-smoke:
    name: Codex loads AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Use OpenAI's official action rather than `npm install -g @openai/codex`
      # + direct `codex exec`, because the action starts the Responses API
      # proxy that API-key auth requires. Direct CLI invocation with only
      # OPENAI_API_KEY in env returns 401 Unauthorized from /v1/responses.
      - name: Codex config probe via official action
        id: codex_config
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "Without running any command or reading any file: according to AGENTS.md, /vet is an alias of which skill? Reply with that skill's directory name only."
          output-file: codex-config-response.txt
          safety-strategy: drop-sudo
          sandbox: read-only

      - name: Verify Codex answered the config probe from AGENTS.md
        run: |
          set -euo pipefail
          if ! grep -q 'is the alias for `implement-review`' AGENTS.md; then
            echo "SKIP: AGENTS.md does not state the vet alias; config probe skipped"
            exit 0
          fi
          RESP=$(cat codex-config-response.txt)
          echo "::group::codex config probe response"
          echo "$RESP"
          echo "::endgroup::"
          if ! grep -q "implement-review" <<<"$RESP"; then
            echo "::error::Codex did not answer implement-review from AGENTS.md (is the file loaded?)"
            exit 1
          fi
          echo "PASS: Codex answered the config probe from AGENTS.md"

  codex-smoke:
    name: Codex sees AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Codex roster probe via official action
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "List the skills shipped in this repository, meaning the directories under skills/ that contain a SKILL.md. Reply with the directory names only, comma-separated, no other text."
          output-file: codex-response.txt
          safety-strategy: drop-sudo
          sandbox: read-only

      - name: Verify Codex response mentions the shipped skill roster
        run: |
          set -euo pipefail
          EXPECTED_SKILLS=()
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] || continue
            EXPECTED_SKILLS+=("$(basename "$d")")
          done
          if [ "${#EXPECTED_SKILLS[@]}" -eq 0 ]; then
            echo "::error::no shipped skills found under skills/"
            exit 1
          fi
          RESP=$(cat codex-response.txt)
          echo "::group::codex roster response"
          echo "$RESP"
          echo "::endgroup::"
          MISSING=()
          for skill in "${EXPECTED_SKILLS[@]}"; do
            if ! grep -q "$skill" <<<"$RESP"; then
              MISSING+=("$skill")
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::missing from response: ${MISSING[*]}"
            exit 1
          fi
          echo "PASS: all ${#EXPECTED_SKILLS[@]} shipped skills mentioned"
