interface:
  display_name: "Prun"
  short_description: "Fan a task out to parallel Agy workers (Codex only when you name it) while the coordinator only integrates"
  default_prompt: "Use $prun to fan a task into independent units that run in parallel on Agy (Gemini through the Antigravity CLI) while the coordinating session only decomposes, gathers each result, reviews each diff, and integrates. Every unit runs on Agy by default. A unit runs on Codex only when the user's request names Codex for that unit or a batch; the coordinator never picks Codex on its own, not even as a fallback when Agy is short, and a Codex unit goes through dispatch-task.sh (dispatch-task.ps1 on Windows) with its model and effort taken from the registry's prun-worker row for Codex. Claude subagents and Workflow agents are never prun units: they bill the coordinator's own account. Workers never commit or push: code-writing units run in a throwaway local clone with its remote removed. Look for the skill at skills/prun/SKILL.md first, then .claude/skills/prun/SKILL.md, then .agent-config/repo/skills/prun/SKILL.md. Read the dispatch-task-agy (or dispatch-task for a Codex unit) and gather scripts under scripts/ at the same path."
