interface:
  display_name: "Editable Figure"
  short_description: "Editable PPTX figures; desktop PowerPoint required"
  default_prompt: "Use $editable-figure to analyze this source, study suitable references, and design the reader takeaway. For Yue Zhao's new paper/proposal overviews, new standalone mechanism figures, and substantial redesigns, generate at least one actual whole-figure visual concept before reconstruction, subject to the skill's narrow exceptions. Recommend two independent concepts when authorized. For other authors, confirm their preferences and respect delegation authorization. Keep diagram text and relationships native while allowing replaceable object art. Deliver an editable PPTX and matching export unless another format or an assessment or prompt-only deliverable was requested."
