interface:
  display_name: "Prun"
  short_description: "Fan a task out to parallel Agy workers (Codex or Grok only when you name it) while the coordinator only integrates"
  default_prompt: "Use $prun to fan a task into independent units that run in parallel on Agy (Gemini through the Antigravity CLI) while the coordinating session only decomposes, gathers each result, reviews each diff, and integrates. Every unit runs on Agy by default. A unit runs on Codex only when the user's request names Codex for that unit or a batch; the coordinator never picks Codex on its own, not even as a fallback when Agy is short, and a Codex unit goes through dispatch-task.sh (dispatch-task.ps1 on Windows) with its model and effort taken from the registry's prun-worker row for Codex. A unit runs on Grok only when the user's request names Grok for that unit or a batch; the coordinator never picks Grok on its own, not even as a fallback when Agy is short (when Agy fails with preflight timed out after 60s or Antigravity preflight failed, exit 124 or 70, offer Grok to the user), and a Grok unit goes through dispatch-task-grok.py with its model and effort taken from the registry's prun-worker row for Grok (see skills/prun/references/grok-executor.md). Claude subagents and Workflow agents are never prun units: they bill the coordinator's own account. Workers never commit or push: code-writing units run in a throwaway local clone with its remote removed. Look for the skill at skills/prun/SKILL.md first, then .claude/skills/prun/SKILL.md, then .agent-config/repo/skills/prun/SKILL.md. Read the dispatch-task-agy (or dispatch-task for a Codex unit, or dispatch-task-grok.py for a Grok unit) and gather scripts under scripts/ at the same path."
