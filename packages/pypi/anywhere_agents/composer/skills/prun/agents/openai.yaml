interface:
  display_name: "Prun"
  short_description: "Fan a task out to parallel Agy workers (Codex or Grok only when you name it) while the coordinator only integrates"
  default_prompt: "Use $prun to fan a task into independent units that run in parallel on Agy (Gemini through the Antigravity CLI), the default worker for every unit, while the coordinating session only decomposes, gathers each result, reviews each diff, and integrates. A unit runs on Codex or Grok only when the user's request names it for that unit or a batch; the coordinator never picks either one, not even as a fallback when Agy is short. Claude subagents and Workflow agents are never prun units, since they bill the coordinator's own account. Look for the skill at skills/prun/SKILL.md first, then .claude/skills/prun/SKILL.md, then .agent-config/repo/skills/prun/SKILL.md, and read its rules, dispatch commands, and reference index there (open a reference only when its read condition holds)."
